name: Check

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and run regressions
        run: node scripts/check.js
      - name: Build XPI
        shell: pwsh
        run: .\build.ps1
